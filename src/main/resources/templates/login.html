<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

        :root{
            --bg1:#071b2a;
            --bg2:#0b2e4f;
            --bg3:#05111f;
            --glass:rgba(255,255,255,0.08);
            --text:#eaf2ff;
            --muted:#cfd8e3;
            --primary1:#00c6ff;
            --primary2:#0072ff;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:24px;
            background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
            color:var(--text);
        }

        .shell{width:100%;max-width:440px;}

        .card{
            padding:28px;
            border-radius:22px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            box-shadow:0 18px 50px rgba(0,0,0,0.42);
            border:1px solid rgba(255,255,255,0.10);
        }

        .brand{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:18px;}
        .brand h1{font-size:26px;letter-spacing:0.2px;}
        .subtitle{color:var(--muted);font-size:14px;text-align:center;}

        .sep{height:1px;background:rgba(255,255,255,0.12);margin:18px 0;}

        .input-group{margin-bottom:16px;}
        .input-group label{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:13px;color:#dbe7ff;}

        .input-group input{
            width:100%;
            padding:13px 14px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.10);
            color:var(--text);
            outline:none;
            transition:transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .input-group input::placeholder{color:rgba(234,242,255,0.65)}

        .input-group input:focus{
            border-color:rgba(0,198,255,0.65);
            box-shadow:0 0 0 4px rgba(0,198,255,0.14);
            transform:translateY(-1px);
        }

        .btn{
            width:100%;
            padding:13px 14px;
            border:none;
            border-radius:12px;
            color:white;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            background:linear-gradient(to right,var(--primary1),var(--primary2));
            transition:transform 180ms ease, filter 180ms ease, box-shadow 180ms ease;
            box-shadow:0 10px 26px rgba(0,114,255,0.25);
        }

        .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
        .btn:active{transform:translateY(0px)}

        .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:2px;}
        .link{color:#57c6ff;text-decoration:none;font-size:14px;transition:opacity 160ms ease}
        .link:hover{opacity:0.9;text-decoration:underline}

        .social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
        .btn-social{
            width:100%;
            padding:11px 12px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.14);
            background:rgba(255,255,255,0.07);
            color:var(--text);
            cursor:pointer;
            transition:transform 160ms ease, border-color 160ms ease, background 160ms ease;
        }
        .btn-social:hover{transform:translateY(-1px);border-color:rgba(0,198,255,0.45);background:rgba(255,255,255,0.10)}

        .hint{font-size:12px;color:rgba(234,242,255,0.72);text-align:center;margin-top:10px;}

        @media (max-width: 420px){
            .card{padding:22px;border-radius:18px}
            .social{grid-template-columns:1fr}
        }
    </style>
</head>

<body>

<div class="shell">
    <div class="card">
        <div class="brand">
            <h1>Welcome Back</h1>
            <p class="subtitle">Secure Login Portal</p>
        </div>

        <form action="/login" method="post" autocomplete="on" novalidate>
            <div class="input-group">
                <label for="email">Email</label>
              <input id="email" name="username" type="email" placeholder="Enter your email" required autocomplete="username"/>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password"/>
            </div>

            <button type="submit" class="btn">Log in</button>

            <div class="sep"></div>

            <div class="social" aria-label="Optional social login">
                <button type="button" class="btn-social" aria-label="Continue with Google">Google</button>
                <button type="button" class="btn-social" aria-label="Continue with GitHub">GitHub</button>
            </div>

            <div class="row" style="margin-top:16px;">
                <span style="font-size:14px;color:rgba(234,242,255,0.85);">Don’t have an account?</span>
                <a class="link" href="/register">Signup</a>
            </div>
        </form>

    </div>
</div>

<script>
    // Basic hardening: trim email and prevent empty submit via whitespace-only input.
    (function(){
        const form = document.querySelector('form');
        const email = document.getElementById('email');
        const password = document.getElementById('password');

        if (!form || !email || !password) return;

        form.addEventListener('submit', function(e){
            email.value = email.value.trim();
            if (password.value.trim().length === 0){
                e.preventDefault();
                password.focus();
            }
        });
    })();
</script>

</body>
</html>
